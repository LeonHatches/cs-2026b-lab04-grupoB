description: 'BiblioUNSA Lab09 sql: respuestas grabadas reales requeridas'
prompts:
- file://v1.txt
- file://v2.txt
- file://v3.txt
providers:
- id: file://../proveedor_grabado.py
  label: fixture-real-no-fabricado
  config:
    tarea: sql
tests:
- description: SQL01 - normal
  vars:
    id: SQL01
    pregunta: Libros con título que contiene álgebra
    esquema_bd: "# BiblioUNSA — Esquema SQL de pruebas\n# Propuesta para Lab 09. No representa una BD implementada.\n\nTABLA libros\n- id: INTEGER, clave primaria\n- titulo: TEXT\n- autor: TEXT\n- categoria: TEXT\n- fecha_ingreso: DATE\n\nTABLA ejemplares\n- id: INTEGER, clave primaria\n- libro_id: INTEGER, referencia a libros.id\n- estado: TEXT\n\nTABLA prestamos\n- id: INTEGER, clave primaria\n- ejemplar_id: INTEGER, referencia a ejemplares.id\n- fecha_vencimiento: DATE\n- fecha_devolucion: DATE, admite NULL\n\nREGLAS:\n- Solo consultas SELECT.\n- No modificar ni eliminar datos.\n- Usar parámetros nombrados como :titulo y :autor.\n- No consultar datos personales.\n- No utilizar tablas o columnas fuera de este esquema.\n- Si falta información, solicitar aclaración.\n"
  assert:
  - type: is-json
    metric: A1_JSON
  - type: javascript
    metric: B2_contrato
    value: |
      try {
        const o = JSON.parse(output);
        return typeof o.requiere_aclaracion === 'boolean' &&
          (typeof o.consulta_sql === 'string' || o.consulta_sql === null) &&
          o.parametros !== null && typeof o.parametros === 'object' &&
          !Array.isArray(o.parametros) && Array.isArray(o.preguntas);
      } catch (e) {
        return false;
      }
  - type: javascript
    metric: B3_solo_select
    value: |
      try {
        const o = JSON.parse(output);
        const sql = o.consulta_sql;
        return sql === null || (
          typeof sql === 'string' &&
          /^\s*SELECT\b/i.test(sql) &&
          !/;|--|\/\*|\*\/|\b(INSERT|UPDATE|DELETE|DROP|ALTER|CREATE|TRUNCATE|EXEC|GRANT|REVOKE|INTO)\b/i.test(sql)
        );
      } catch (e) {
        return false;
      }
  - type: javascript
    metric: B4_consistencia
    value: |
      try {
        const o = JSON.parse(output);
        return typeof o.requiere_aclaracion === 'boolean' &&
          Array.isArray(o.preguntas) &&
          (o.requiere_aclaracion
            ? (o.consulta_sql === null && o.preguntas.length > 0)
            : (typeof o.consulta_sql === 'string' && o.preguntas.length === 0));
      } catch (e) {
        return false;
      }
