name: Lab06 - Validar y exportar C4

on:
  workflow_dispatch:
  push:
    branches:
      - lab06/romina-exportacion-revision
    paths:
      - "docs/architecture/c4/workspace.dsl"
      - ".github/workflows/lab06-c4.yml"

jobs:
  exportar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Validar workspace.dsl
        run: |
          docker run --rm \
            -v "$PWD/docs/architecture/c4:/usr/local/structurizr" \
            structurizr/cli:latest \
            validate -workspace workspace.dsl

      - name: Exportar PlantUML
        run: |
          mkdir -p docs/architecture/c4/export/plantuml
          docker run --rm \
            -v "$PWD/docs/architecture/c4:/usr/local/structurizr" \
            structurizr/cli:latest \
            export -workspace workspace.dsl \
            -format plantuml/c4plantuml \
            -output /usr/local/structurizr/export/plantuml

      - name: Exportar Mermaid
        run: |
          mkdir -p docs/architecture/c4/export/mermaid
          docker run --rm \
            -v "$PWD/docs/architecture/c4:/usr/local/structurizr" \
            structurizr/cli:latest \
            export -workspace workspace.dsl \
            -format mermaid \
            -output /usr/local/structurizr/export/mermaid

      - name: Guardar archivos exportados
        uses: actions/upload-artifact@v4
        with:
          name: lab06-c4-exportaciones
          path: docs/architecture/c4/export/
          if-no-files-found: error
