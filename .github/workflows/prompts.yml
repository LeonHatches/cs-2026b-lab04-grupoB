name: Evaluacion de prompts BiblioUNSA

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluar:
    name: Lab09 - Evaluación de prompts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Mostrar versiones
        run: |
          python --version
          node --version
          npm --version

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest jsonschema sqlglot pyyaml

      - name: Ejecutar pruebas de integracion
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -v tests/test_generador.py

      - name: Instalar Promptfoo
        run: |
          npm install --global promptfoo
          promptfoo --version

      - name: Evaluar Tarea A - Criterios (v3)
        run: |
          npx promptfoo eval -c prompts/criterios/promptfooconfig.ci.yaml

      - name: Evaluar Tarea B - SQL (v3)
        run: |
          npx promptfoo eval -c prompts/sql/promptfooconfig.ci.yaml
