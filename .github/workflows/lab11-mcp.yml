name: lab11-bibliounsa-mcp
on:
  pull_request:
    paths:
      - 'bibliounsa_mcp/**'
      - '.github/workflows/lab11-mcp.yml'
  workflow_dispatch:
jobs:
  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bibliounsa_mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'mcp==2.3.0' pytest
      - run: python -m pytest -q pruebas
      - run: python cliente/explorar.py
